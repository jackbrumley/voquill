<svg class="hero-art" viewBox="0 0 420 340" aria-hidden="true" focusable="false">
  <!-- Voquill's version of the family hero art: the hexagon layout and
       gradients of Rusty G6 / SomeDrive, drawn as three sharp-edged sound bars with angled ends. -->
  <defs>
    <linearGradient id="vq-big" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c43991" stop-opacity="0.05" />
      <stop offset="1" stop-color="#5865f2" stop-opacity="0.45" />
    </linearGradient>
    <!-- Strongest at the top right, where it sits in front of the big bar. -->
    <linearGradient id="vq-mid" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ab7d6" stop-opacity="0.8" />
      <stop offset="1" stop-color="#5865f2" stop-opacity="0.12" />
    </linearGradient>
    <!-- Strongest at its outer (right) side, fading where it passes behind the big bar. -->
    <linearGradient id="vq-small" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c43991" stop-opacity="0.7" />
      <stop offset="1" stop-color="#c43991" stop-opacity="0.06" />
    </linearGradient>
  </defs>
  <!-- Back to front: the right bar, the big bar, the left bar. -->
  <polygon points="300,108.4 376,97.8 376,207.2 300,217.8" fill="url(#vq-small)" />
  <polygon points="178,60 322,40 322,280 178,300" fill="url(#vq-big)" />
  <polygon points="104,116.9 200,103.6 200,250.3 104,263.6" fill="url(#vq-mid)" />
  <!-- Hairline on the big bar, stopping where the medium bar covers it. -->
  <polyline points="178,106.7 178,60 322,40" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1" />
</svg>
