# Compiles, lints and tests Voquill on Linux, Windows and macOS (Apple Silicon)
# for every push to dev/main and every pull request, so platform-specific code
# is verified without the maintainer switching operating systems. Installers
# are built only by release.yml.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (typecheck, lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: Windows
            runner: windows-2022
          - name: macOS
            runner: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      - name: Build frontend
        run: npm run build

      - name: cargo fmt
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # /bin/bash on macOS is bash 3.2, the version users' installs run under.
      - name: Check installer script syntax
        if: runner.os != 'Windows'
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            scripts=(docs/install-macos.sh docs/uninstall-macos.sh)
          else
            scripts=(docs/install.sh docs/uninstall.sh)
          fi
          for script in "${scripts[@]}"; do
            /bin/bash -n "$script"
          done

  # Runs the one-line installer exactly as users and the in-app updater do (no
  # --version), so the "find the latest release" path is exercised on every
  # push. release.yml's install tests pin --version and cannot cover it.
  installer:
    name: Installer (Linux, latest release)
    runs-on: ubuntu-24.04
    env:
      VOQUILL_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the latest release
        run: |
          bash docs/install.sh --yes --no-relaunch
          latest=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)
          /usr/bin/voquill --version | grep -F "${latest#v}"
        env:
          GH_TOKEN: ${{ github.token }}
