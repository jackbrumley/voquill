# Shared build environment for CI and release jobs on all three platforms:
# Node, Rust, the pinned LunarG Vulkan SDK (whisper.cpp's ggml-vulkan backend
# needs its headers and glslc), and the per-OS native toolchain. Keeping it in
# one place means CI checks and release builds can never drift apart. Versions
# come from .node-version, rust-toolchain.toml and
# src-tauri/packaging/vulkan-sdk.json, which the Linux release container reads
# too.
name: Set up Voquill build environment
description: Installs Node, Rust, the Vulkan SDK and platform build dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: npm

    # Installs the version (and components) pinned in rust-toolchain.toml.
    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install

    # Mirrors the release Containerfile's package list, so `npm run deps:check`
    # (run by the frontend build) sees the same environment.
    - name: Install Linux system libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          appstream desktop-file-utils libasound2-dev libclang-dev libfuse2t64 \
          libgtk-3-dev libgtk-layer-shell-dev libpulse-dev librsvg2-dev libssl-dev \
          libudev-dev libvulkan-dev libwebkit2gtk-4.1-dev patchelf squashfs-tools \
          wl-clipboard

    # Ninja + MSVC environment match the local Windows build (tauri-runner.mjs
    # selects the Ninja generator for whisper.cpp), and the short target
    # directory avoids the 260-character path limit in the Vulkan shader build.
    - name: Configure Windows toolchain
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install ninja --no-progress -y
        "CARGO_TARGET_DIR=C:\vb" >> $env:GITHUB_ENV
        "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV

    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'

    - name: Read Vulkan SDK version
      id: vulkan-sdk
      shell: bash
      run: echo "version=$(node -p "require('./src-tauri/packaging/vulkan-sdk.json').version")" >> "$GITHUB_OUTPUT"

    - uses: jakoch/install-vulkan-sdk-action@v1.7.0
      with:
        vulkan_version: ${{ steps.vulkan-sdk.outputs.version }}
        cache: true

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Install npm dependencies
      shell: bash
      run: npm ci
