# Shared build environment for CI and release jobs on all three platforms:
# Node, Rust, the pinned LunarG Vulkan SDK (whisper.cpp's ggml-vulkan backend
# needs its headers and glslc), and the per-OS native toolchain. Keeping it in
# one place means CI checks and release builds can never drift apart.
name: Set up Voquill build environment
description: Installs Node, Rust, the Vulkan SDK and platform build dependencies.

inputs:
  vulkan-sdk-version:
    description: LunarG Vulkan SDK version (keep in step with the Linux release Containerfile).
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Install Linux system libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libasound2-dev libayatana-appindicator3-dev libclang-dev libgtk-3-dev \
          libgtk-layer-shell-dev libpulse-dev librsvg2-dev libssl-dev libudev-dev \
          libvulkan-dev libwebkit2gtk-4.1-dev patchelf

    # Ninja + MSVC environment match the local Windows build (tauri-runner.mjs
    # selects the Ninja generator for whisper.cpp), and the short target
    # directory avoids the 260-character path limit in the Vulkan shader build.
    - name: Configure Windows toolchain
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install ninja --no-progress -y
        "CARGO_TARGET_DIR=C:\vb" >> $env:GITHUB_ENV
        "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV

    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'

    - uses: jakoch/install-vulkan-sdk-action@v1.7.0
      with:
        vulkan_version: ${{ inputs.vulkan-sdk-version }}
        cache: true

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Install npm dependencies
      shell: bash
      run: npm ci
